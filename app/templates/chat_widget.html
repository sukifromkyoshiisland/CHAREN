
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Georgia, serif;
      background: #F5F1E8;
      color: #293E33;
    }

    .chat {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 0;
      padding: 16px;
      gap: 12px;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant {
      align-self: flex-start;
      background: #FFFFFF;
    }

    .user {
      align-self: flex-end;
      background: #E2E9E1;
    }

    .message strong {
      font-weight: 700;
    }

    .message em {
      font-style: italic;
    }

    .composer {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #D9D0C6;
      border-radius: 8px;
      background: white;
      font: inherit;
      font-size: 14px;
    }

    button {
      padding: 12px 17px;
      background: #68463E;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }
  </style>
</head>

<body>
  <div class="chat">
    <div id="messages" class="messages">
      <div class="message assistant">Welcome to CHARÉN. I'm your AI Tea Sommelier. How can I help you explore the world of tea?</div>
    </div>

    <form id="chatForm" class="composer">
      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="Ask me anything about tea..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const button = document.getElementById("sendButton");

    // Safely render basic Markdown without inserting untrusted HTML.
    function renderMessage(element, text) {
      element.replaceChildren();

      const pattern = /(\*\*[^*\n]+\*\*|\*[^*\n]+\*)/g;
      let lastIndex = 0;

      for (const match of text.matchAll(pattern)) {
        const index = match.index;

        if (index > lastIndex) {
          element.appendChild(
            document.createTextNode(text.slice(lastIndex, index))
          );
        }

        const token = match[0];
        const isBold = token.startsWith("**");
        const formatted = document.createElement(
          isBold ? "strong" : "em"
        );

        formatted.textContent = isBold
          ? token.slice(2, -2)
          : token.slice(1, -1);

        element.appendChild(formatted);
        lastIndex = index + token.length;
      }

      if (lastIndex < text.length) {
        element.appendChild(
          document.createTextNode(text.slice(lastIndex))
        );
      }
    }

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = "message " + role;

      if (role === "assistant") {
        renderMessage(element, text);
      } else {
        element.textContent = text;
      }

      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const mesaj = input.value.trim();
      if (!mesaj || button.disabled) return;

      addMessage(mesaj, "user");
      input.value = "";
      button.disabled = true;

      const loading = addMessage("Typing...", "assistant");

      try {
        const response = await fetch(
          "https://charen.onrender.com/api/chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ mesaj })
          }
        );

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
          throw new Error(
            "The chat service is temporarily unavailable. Please try again."
          );
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Something went wrong. Please try again."
          );
        }

        renderMessage(loading, data.yanit || "No response received.");

      } catch (error) {
        loading.textContent = error.message;
      } finally {
        button.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
