
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Georgia, serif;
      background: #F5F1E8;
      color: #293E33;
    }

    .chat {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 0;
      padding: 16px;
      gap: 12px;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant {
      align-self: flex-start;
      background: #FFFFFF;
    }

    .user {
      align-self: flex-end;
      background: #E2E9E1;
    }

    .composer {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #D9D0C6;
      border-radius: 8px;
      background: white;
      font: inherit;
      font-size: 14px;
    }

    button {
      padding: 12px 17px;
      background: #68463E;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }
  </style>
</head>

<body>
  <div class="chat">
    <div id="messages" class="messages">
      <div class="message assistant">Merhaba! Ben CHARÉN AI Tea Sommelier. Bugün nasıl bir çay keşfetmek istersin?</div>
    </div>

    <form id="chatForm" class="composer">
      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="Çay hakkında bir şey sor..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">Gönder</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const button = document.getElementById("sendButton");

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = "message " + role;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const mesaj = input.value.trim();
      if (!mesaj || button.disabled) return;

      addMessage(mesaj, "user");
      input.value = "";
      button.disabled = true;

      const loading = addMessage("Yazıyor...", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ mesaj })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Bir hata oluştu.");
        }

        loading.textContent = data.yanit;
      } catch (error) {
        loading.textContent = error.message;
      } finally {
        button.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
